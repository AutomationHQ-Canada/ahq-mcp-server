[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahq-mcp-server"
version = "1.6.1"
description = "AutomationHQ MCP server — AI-powered test script generation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0",  # Fernet for hosted OAuth blobs; already in uv.lock via mcp->pyjwt[crypto], pinned explicitly since we import it directly

    "playwright>=1.61,<1.62",  # browser build is tied to the minor version - bump BOTH this and run `playwright install chromium` together
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ahq-mcp = "src.mcp_server:main"
ahq-mcp-http = "src.http_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
