apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahq-mcp-server
  labels:
    app.kubernetes.io/name: ahq-mcp-server
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: testing-wire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ahq-mcp-server
  template:
    metadata:
      labels:
        app: ahq-mcp-server
        tier: backend
    spec:
      containers:
      - name: ahq-mcp-server
        image: 501429054313.dkr.ecr.us-east-2.amazonaws.com/ahq-mcp-server:ImageTag
        imagePullPolicy: Always
        envFrom:
          - configMapRef:
              name: ahq-mcp-server-config
        resources:
          requests:
            memory: "300Mi"
            cpu: "200m"
          limits:
            memory: "800Mi"
            cpu: "1000m"
        ports:
        - containerPort: 8000
        readinessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          httpGet:
            scheme: HTTP
            path: /healthz
            port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ahq-mcp-server
  labels:
    app.kubernetes.io/name: ahq-mcp-server
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/part-of: testing-wire
spec:
  selector:
    app: ahq-mcp-server
    tier: backend
  ports:
    - port: 8000
      targetPort: 8000
