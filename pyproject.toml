[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahq-mcp-server"
version = "0.1.0"
description = "AutomationHQ MCP server — AI-powered test script generation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ahq-mcp = "src.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
