name: ahq-mcp-server
tier: backend
parent: ahq-backend
# CONFIRM with DevOps: prod service-account name (dev uses ahq-dev-service-account)
serviceAccountName: ahq-prod-service-account
component: api
image: 501429054313.dkr.ecr.us-east-2.amazonaws.com/ahq-mcp-server
imageTag: 1
imagePullPolicy: Always
containerPort: 8000
configname: ahq-mcp-server-prod-configmap
replicas: 2
environment: prod
# CONFIRM with DevOps: prod Secret with AHQ_MCP_AUTH_SECRET — MUST be the same value on both
# replicas (stateless OAuth tokens; a mismatch silently invalidates half of all logins).
secretName: ahq-mcp-server-secrets
# Chromium headroom (Slice 9j).
resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1536Mi"

hpa:
  enabled: false

vpa:
  enabled: false

#####################
# No tenant credentials server-side: each caller supplies their own AHQ token (OAuth Bearer or
# X-API-AUTH-KEY header — see src/hosted/). The only secret is the OAuth blob key, which lives
# in the Secret referenced by secretName above, not here.
# CONFIRM with DevOps: the prod gateway URL.
data:
  AHQ_BASE_URL: "https://api.automationhq.ai"
  AHQ_MCP_PUBLIC_BASE_URL: "https://api.automationhq.ai/ahq-mcp-server"
  AHQ_MCP_RATE_LIMIT_PER_MIN: "60"
  AHQ_MCP_CRAWL_CONCURRENCY: "2"
  # Consent-page branding. These are read by src/hosted/consent.py and need no code change —
  # the page title, heading, logo, token-field copy and rejection text all follow them.
  AHQ_MCP_PARTNER_DISPLAY_NAME: "TestBots.ai"
  AHQ_MCP_PARTNER_LOGO_URL: "https://testbots.ai/favicon.png"
  AHQ_MCP_PARTNER_PRIMARY_COLOR: "#7c3aed"
