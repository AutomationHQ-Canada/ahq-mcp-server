name: ahq-mcp-server
tier: backend
parent: ahq-backend
serviceAccountName: ahq-dev-service-account
component: api
image: 501429054313.dkr.ecr.us-east-2.amazonaws.com/ahq-mcp-server
imageTag: 1
imagePullPolicy: Always
containerPort: 8000
configname: ahq-mcp-server-dev-configmap
replicas: 1
environment: dev
# k8s Secret with AHQ_MCP_AUTH_SECRET (random 64 chars, same on every replica) — created by
# DevOps out-of-band, never in this chart. Required since Slice 9m's stateless OAuth tokens.
secretName: ahq-mcp-server-secrets
# Chromium headroom (Slice 9j bakes headless Chromium into the image; up to
# AHQ_MCP_CRAWL_CONCURRENCY browsers run simultaneously).
resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1536Mi"

hpa:
  enabled: false

vpa:
  enabled: false

#####################
# No tenant credentials server-side: each caller supplies their own AHQ token (OAuth Bearer or
# X-API-AUTH-KEY header — see src/hosted/). The only secret is the OAuth blob key, which lives
# in the Secret referenced by secretName above, not here.
data:
  AHQ_BASE_URL: "https://api-dev.automationhq.ai"
  # Public URL of this service THROUGH the gateway, including the route prefix — every URL
  # advertised to OAuth clients is built from this.
  AHQ_MCP_PUBLIC_BASE_URL: "https://api-dev.automationhq.ai/ahq-mcp-server"
  AHQ_MCP_RATE_LIMIT_PER_MIN: "60"
  AHQ_MCP_CRAWL_CONCURRENCY: "2"
  # Consent-page branding. These are read by src/hosted/consent.py and need no code change —
  # the page title, heading, logo, token-field copy and rejection text all follow them.
  AHQ_MCP_PARTNER_DISPLAY_NAME: "TestBots.ai"
  AHQ_MCP_PARTNER_LOGO_URL: "https://testbots.ai/favicon.png"
  AHQ_MCP_PARTNER_PRIMARY_COLOR: "#7c3aed"
